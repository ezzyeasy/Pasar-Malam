<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 84" width="320" height="336" shape-rendering="crispEdges">
  <!-- Drop Shadow -->
  <rect x="6" y="8" width="68" height="72" fill="#090a0f" fill-opacity="0.55"/>

  <!-- Wooden Table & Satay Grill Counter (Under Canopy) -->
  <rect x="12" y="42" width="52" height="34" fill="#451a03"/>
  <rect x="14" y="44" width="48" height="30" fill="#78350f"/>

  <!-- Satay Vendor (Abang Satay flipping skewers with kipas) -->
  <rect x="20" y="48" width="8" height="8" fill="#1c1917"/>
  <rect x="19" y="56" width="10" height="10" fill="#b91c1c"/>
  <rect x="29" y="58" width="4" height="3" fill="#e0a97f"/>
  <!-- Woven Fan (Kipas Satay) -->
  <rect x="32" y="55" width="5" height="5" fill="#eab308"/>

  <!-- Charcoal Satay Grill Pit (Glowing embers & skewers) -->
  <rect x="44" y="48" width="18" height="24" fill="#1e293b"/>
  <rect x="46" y="50" width="14" height="20" fill="#334155"/>
  <!-- Glowing Charcoal Embers -->
  <rect x="48" y="52" width="10" height="16" fill="#7f1d1d"/>
  <rect x="49" y="54" width="4" height="3" fill="#ef4444"/>
  <rect x="53" y="60" width="4" height="4" fill="#f97316"/>
  <rect x="49" y="63" width="3" height="3" fill="#facc15"/>
  <!-- Satay Skewers across Grill -->
  <rect x="46" y="53" width="14" height="1" fill="#d97706"/>
  <rect x="49" y="53" width="8" height="2" fill="#92400e"/>
  <rect x="46" y="57" width="14" height="1" fill="#d97706"/>
  <rect x="49" y="57" width="8" height="2" fill="#b45309"/>
  <rect x="46" y="61" width="14" height="1" fill="#d97706"/>
  <rect x="49" y="61" width="8" height="2" fill="#92400e"/>
  <rect x="46" y="65" width="14" height="1" fill="#d97706"/>
  <rect x="49" y="65" width="8" height="2" fill="#b45309"/>

  <!-- Peanut Sauce (Kuah Kacang) Pot & Ketupat Basket -->
  <rect x="16" y="64" width="10" height="8" fill="#94a3b8"/>
  <rect x="18" y="66" width="6" height="4" fill="#b45309"/>
  <rect x="28" y="65" width="10" height="7" fill="#15803d"/>
  <rect x="30" y="66" width="3" height="3" fill="#86efac"/>
  <rect x="34" y="67" width="3" height="3" fill="#4ade80"/>

  <!-- Yellow Vertical Price Banner Sign (like in Figma) -->
  <rect x="65" y="34" width="9" height="22" fill="#78350f"/>
  <rect x="66" y="35" width="7" height="20" fill="#facc15"/>
  <rect x="68" y="38" width="3" height="2" fill="#1e293b"/>
  <rect x="68" y="42" width="3" height="3" fill="#dc2626"/>
  <rect x="68" y="47" width="3" height="2" fill="#1e293b"/>
  <rect x="68" y="51" width="3" height="2" fill="#1e293b"/>

  <!-- Pyramidal Red Pasar Malam Canopy Tent -->
  <!-- Base border -->
  <rect x="8" y="6" width="56" height="40" fill="#7f1d1d"/>
  <!-- Left Triangle Facet -->
  <rect x="10" y="8" width="14" height="36" fill="#dc2626"/>
  <!-- Top Triangle Facet -->
  <rect x="10" y="8" width="52" height="14" fill="#ef4444"/>
  <!-- Right Triangle Facet -->
  <rect x="48" y="8" width="14" height="36" fill="#991b1b"/>
  <!-- Bottom Triangle Facet -->
  <rect x="10" y="32" width="52" height="12" fill="#b91c1c"/>
  <!-- Canopy Peak & Ridge Lines -->
  <rect x="33" y="22" width="6" height="4" fill="#fca5a5"/>
  <rect x="10" y="44" width="52" height="3" fill="#991b1b"/>

  <!-- Hanging Warm Stall Light Bulb -->
  <rect x="35" y="46" width="3" height="3" fill="#fef08a"/>
  <rect x="33" y="45" width="7" height="6" fill="#facc15" fill-opacity="0.35"/>
</svg>
