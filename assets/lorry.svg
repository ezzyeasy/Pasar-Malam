<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 92" width="192" height="368" shape-rendering="crispEdges">
  <!-- Drop Shadow -->
  <rect x="4" y="6" width="42" height="84" fill="#090a0f" fill-opacity="0.55"/>

  <!-- Cargo Box (Rear Top-Down) -->
  <rect x="6" y="4" width="36" height="54" fill="#334155"/>
  <rect x="7" y="5" width="34" height="52" fill="#64748b"/>
  <rect x="9" y="7" width="30" height="48" fill="#94a3b8"/>
  <!-- Roof ribs -->
  <rect x="9" y="14" width="30" height="1" fill="#64748b"/>
  <rect x="9" y="24" width="30" height="1" fill="#64748b"/>
  <rect x="9" y="34" width="30" height="1" fill="#64748b"/>
  <rect x="9" y="44" width="30" height="1" fill="#64748b"/>

  <!-- Side Mirrors -->
  <rect x="2" y="64" width="4" height="2" fill="#1e293b"/>
  <rect x="1" y="65" width="2" height="4" fill="#0f172a"/>
  <rect x="42" y="64" width="4" height="2" fill="#1e293b"/>
  <rect x="45" y="65" width="2" height="4" fill="#0f172a"/>

  <!-- Truck Cab (Blue) -->
  <rect x="7" y="58" width="34" height="28" fill="#1e3a8a"/>
  <rect x="8" y="59" width="32" height="25" fill="#1d4ed8"/>
  <rect x="10" y="60" width="28" height="10" fill="#2563eb"/>

  <!-- Front Windshield -->
  <rect x="9" y="70" width="30" height="8" fill="#0f172a"/>
  <rect x="10" y="71" width="28" height="6" fill="#1e293b"/>
  <!-- Windshield reflection -->
  <rect x="12" y="72" width="8" height="2" fill="#38bdf8" fill-opacity="0.35"/>
  <rect x="28" y="73" width="6" height="2" fill="#38bdf8" fill-opacity="0.25"/>

  <!-- Front Hood & Grille -->
  <rect x="9" y="79" width="30" height="5" fill="#1d4ed8"/>
  <rect x="16" y="83" width="16" height="2" fill="#0f172a"/>
  <rect x="18" y="83" width="12" height="1" fill="#94a3b8"/>

  <!-- Front Bumper -->
  <rect x="7" y="85" width="34" height="3" fill="#1e293b"/>

  <!-- Headlights -->
  <rect x="9" y="84" width="5" height="2" fill="#fef08a"/>
  <rect x="34" y="84" width="5" height="2" fill="#fef08a"/>
  <rect x="8" y="84" width="1" height="2" fill="#f97316"/>
  <rect x="39" y="84" width="1" height="2" fill="#f97316"/>
</svg>
