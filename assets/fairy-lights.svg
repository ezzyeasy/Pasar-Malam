  <rect x="22" y="6" width="24" height="1" fill="#111318"/>
  <rect x="46" y="8" width="28" height="1" fill="#111318"/>
  <rect x="74" y="9" width="32" height="1" fill="#111318"/>
  <rect x="106" y="8" width="28" height="1" fill="#111318"/>
  <rect x="134" y="6" width="24" height="1" fill="#111318"/>
  <rect x="158" y="4" width="22" height="1" fill="#111318"/>

  <!-- Bulb Sockets -->
