    <rect x="14" y="6" width="6" height="6"/>
    <rect x="36" y="8" width="6" height="6"/>
    <rect x="62" y="10" width="6" height="6"/>
    <rect x="88" y="11" width="6" height="6"/>
    <rect x="114" y="10" width="6" height="6"/>
    <rect x="140" y="8" width="6" height="6"/>
