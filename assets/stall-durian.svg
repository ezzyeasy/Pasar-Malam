  <g>
    <rect x="17" y="47" width="8" height="8" fill="#365314"/>
    <rect x="18" y="48" width="6" height="6" fill="#65a30d"/>
    <rect x="26" y="47" width="8" height="8" fill="#365314"/>
    <rect x="27" y="48" width="6" height="6" fill="#84cc16"/>
    <rect x="21" y="54" width="8" height="8" fill="#365314"/>
