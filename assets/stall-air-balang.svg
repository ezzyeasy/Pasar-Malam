<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 84" width="320" height="336" shape-rendering="crispEdges">
  <!-- Drop Shadow -->
  <rect x="6" y="8" width="68" height="72" fill="#090a0f" fill-opacity="0.55"/>

  <!-- Table with Pink Malaysian Plastic Tablecloth -->
  <rect x="14" y="42" width="50" height="36" fill="#831843"/>
  <rect x="16" y="44" width="46" height="32" fill="#db2777"/>
  <rect x="18" y="46" width="42" height="28" fill="#f472b6"/>

  <!-- 3 Iconic Clear Air Balang Vats (Sirap Bandung, Air Jagung, Air Katira/Pandan) -->
  <!-- Vat 1: Sirap Bandung (Rose Pink) -->
  <rect x="19" y="47" width="12" height="9" fill="#0f172a"/>
  <rect x="20" y="48" width="10" height="7" fill="#ec4899"/>
  <rect x="21" y="49" width="8" height="4" fill="#f9a8d4"/>
  <!-- Vat 2: Air Jagung (Sweet Corn Gold) -->
  <rect x="19" y="57" width="12" height="9" fill="#0f172a"/>
  <rect x="20" y="58" width="10" height="7" fill="#eab308"/>
  <rect x="21" y="59" width="8" height="4" fill="#fef08a"/>
  <!-- Vat 3: Air Katira / Pandan (Emerald Green) -->
  <rect x="19" y="67" width="12" height="9" fill="#0f172a"/>
  <rect x="20" y="68" width="10" height="7" fill="#10b981"/>
  <rect x="21" y="69" width="8" height="4" fill="#6ee7b7"/>

  <!-- Plastic Cup Stacks & Straws -->
  <rect x="34" y="50" width="5" height="5" fill="#e2e8f0"/>
  <rect x="35" y="51" width="3" height="3" fill="#ef4444"/>
  <rect x="34" y="60" width="6" height="8" fill="#1e3a8a"/>
  <rect x="35" y="61" width="4" height="6" fill="#38bdf8"/>

  <!-- Vendor behind counter -->
  <rect x="45" y="52" width="8" height="8" fill="#1c1917"/>
  <rect x="44" y="60" width="10" height="10" fill="#0284c7"/>
  <rect x="40" y="61" width="4" height="3" fill="#e0a97f"/>

  <!-- Yellow Banner Sign (RM3) -->
  <rect x="6" y="34" width="8" height="20" fill="#78350f"/>
  <rect x="7" y="35" width="6" height="18" fill="#facc15"/>
  <rect x="9" y="38" width="2" height="3" fill="#dc2626"/>
  <rect x="9" y="43" width="2" height="6" fill="#1e293b"/>

  <!-- Pyramidal Yellow Pasar Malam Canopy Tent -->
  <rect x="12" y="6" width="56" height="40" fill="#a16207"/>
  <rect x="14" y="8" width="52" height="14" fill="#facc15"/>
  <rect x="14" y="8" width="14" height="36" fill="#eab308"/>
  <rect x="52" y="8" width="14" height="36" fill="#ca8a04"/>
  <rect x="14" y="32" width="52" height="12" fill="#eab308"/>
  <rect x="37" y="22" width="6" height="4" fill="#fef08a"/>
  <rect x="14" y="44" width="52" height="3" fill="#a16207"/>

  <!-- Hanging Warm Stall Light Bulb -->
  <rect x="38" y="46" width="3" height="3" fill="#fef08a"/>
  <rect x="36" y="45" width="7" height="6" fill="#facc15" fill-opacity="0.35"/>
</svg>
