<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="128" height="160" shape-rendering="crispEdges">
  <!-- Glowing Green RPG Selection Ring -->
  <g class="selection-ring">
    <rect x="7" y="31" width="18" height="1" fill="#4ade80" fill-opacity="0.4"/>
    <rect x="5" y="32" width="22" height="1" fill="#4ade80" fill-opacity="0.9"/>
    <rect x="4" y="33" width="2" height="3" fill="#4ade80" fill-opacity="0.95"/>
    <rect x="26" y="33" width="2" height="3" fill="#4ade80" fill-opacity="0.95"/>
    <rect x="5" y="36" width="22" height="1" fill="#4ade80" fill-opacity="0.95"/>
    <rect x="7" y="37" width="18" height="1" fill="#22c55e" fill-opacity="0.5"/>
    <!-- Inner dark shadow -->
    <rect x="8" y="33" width="16" height="3" fill="#090a0f" fill-opacity="0.65"/>
  </g>

  <!-- Left Foot & Leg -->
  <rect x="11" y="28" width="4" height="5" fill="#1e3a8a"/>
  <rect x="12" y="28" width="2" height="4" fill="#2563eb"/>
  <rect x="11" y="33" width="4" height="2" fill="#e2e8f0"/>
  <rect x="11" y="34" width="4" height="1" fill="#dc2626"/>

  <!-- Right Foot & Leg -->
  <rect x="17" y="28" width="4" height="5" fill="#1e3a8a"/>
  <rect x="18" y="28" width="2" height="4" fill="#2563eb"/>
  <rect x="17" y="33" width="4" height="2" fill="#e2e8f0"/>
  <rect x="17" y="34" width="4" height="1" fill="#dc2626"/>

  <!-- Torso / Shirt -->
  <rect x="10" y="16" width="12" height="12" fill="#1e293b"/>
  <rect x="11" y="16" width="10" height="11" fill="#334155"/>

  <!-- Left Arm -->
  <rect x="8" y="17" width="2" height="6" fill="#334155"/>
  <rect x="8" y="23" width="2" height="3" fill="#e0a97f"/>

  <!-- Right Arm -->
  <rect x="22" y="17" width="2" height="6" fill="#334155"/>
  <rect x="22" y="23" width="2" height="3" fill="#e0a97f"/>

  <!-- Pasar Malam Red & White Plastic Bag in Right Hand -->
  <rect x="22" y="25" width="1" height="2" fill="#f8fafc"/>
  <rect x="24" y="25" width="1" height="2" fill="#ef4444"/>
  <rect x="21" y="27" width="5" height="5" fill="#f8fafc"/>
  <rect x="22" y="27" width="1" height="5" fill="#ef4444"/>
  <rect x="24" y="27" width="1" height="5" fill="#ef4444"/>
  <rect x="22" y="32" width="3" height="1" fill="#cbd5e1"/>

  <!-- Backpack (Back view details) -->
  <rect x="11" y="17" width="1" height="9" fill="#d97706"/>
  <rect x="20" y="17" width="1" height="9" fill="#d97706"/>
  <rect x="12" y="18" width="8" height="9" fill="#78350f"/>
  <rect x="13" y="18" width="6" height="8" fill="#92400e"/>
  <rect x="13" y="19" width="6" height="2" fill="#b45309"/>
  <rect x="13" y="22" width="6" height="4" fill="#78350f"/>
  <rect x="14" y="22" width="4" height="1" fill="#f59e0b"/>

  <!-- Head & Hair -->
  <rect x="11" y="6" width="10" height="10" fill="#1c1917"/>
  <rect x="10" y="8" width="12" height="7" fill="#1c1917"/>
  <!-- Hair highlights -->
  <rect x="12" y="7" width="7" height="2" fill="#44403c"/>
  <rect x="13" y="9" width="6" height="4" fill="#292524"/>
  <!-- Ears & Neck -->
  <rect x="9" y="11" width="1" height="3" fill="#e0a97f"/>
  <rect x="22" y="11" width="1" height="3" fill="#e0a97f"/>
  <rect x="13" y="15" width="6" height="1" fill="#c68e63"/>
</svg>
